name: lenses
services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [web]
    working_dir: /usr/share/nginx/html
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - 'traefik.http.routers.lenses.rule=Host(`lenses.helios.users.ctx7.dev`)'
      - traefik.http.routers.lenses.entrypoints=websecure
      - traefik.http.routers.lenses.tls=true
      - traefik.http.routers.lenses.tls.certresolver=cloudflare
      - 'traefik.http.routers.lenses.tls.domains[0].main=helios.users.ctx7.dev'
      - 'traefik.http.routers.lenses.tls.domains[0].sans=*.helios.users.ctx7.dev'
      - traefik.http.services.lenses.loadbalancer.server.port=80

networks:
  web: { external: true }
